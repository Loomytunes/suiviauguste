<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Auguste" />
    <title>Suivi Auguste</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      #splash { position: fixed; inset: 0; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .logo { font-size: 2rem; margin-bottom: 0.5rem; }
      #splash .title { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
      #splash .spinner { width: 32px; height: 32px; margin-top: 1.5rem; border: 3px solid #e2e8f0; border-top-color: #64748b; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="logo" role="img" aria-label="Auguste">👦</span>
      <span class="title">Auguste</span>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
